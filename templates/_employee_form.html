
<form method="post" class="card border-0 shadow-sm p-4 form-card">
  <div class="row g-3">

    <div class="col-md-6">
      <label class="form-label">Full name *</label>
      <input class="form-control" name="name"
             required value="{{ employee.name or '' }}">
    </div>

    <div class="col-md-6">
      <label class="form-label">Email *</label>
      <input class="form-control" type="email" name="email"
             required value="{{ employee.email or '' }}">
    </div>

    <div class="col-md-6">
      <label class="form-label">Department</label>
      <input class="form-control" name="department"
             value="{{ employee.department or '' }}">
    </div>

    <div class="col-md-6">
      <label class="form-label">Designation</label>
      <input class="form-control" name="designation"
             value="{{ employee.designation or '' }}">
    </div>

    <div class="col-md-6">
      <label class="form-label">Salary</label>
      <input class="form-control" type="number"
             min="0" step="0.01" name="salary"
             value="{{ employee.salary or 0 }}">
    </div>

  </div>

  <div class="mt-4 d-flex gap-2">
    <button class="btn btn-primary">Save employee</button>
    <a class="btn btn-outline-secondary"
       href="{{ url_for('index') }}">Cancel</a>
  </div>
</form>
